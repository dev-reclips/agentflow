name: Deploy

on:
  push:
    branches: [main]

jobs:
  check-secrets:
    name: Check deployment secrets
    runs-on: ubuntu-latest
    outputs:
      api-ready: ${{ steps.check.outputs.api-ready }}
      web-ready: ${{ steps.check.outputs.web-ready }}
    steps:
      - name: Check secrets configured
        id: check
        run: |
          api_ready=true
          web_ready=true
          [ -z "$DATABASE_URL" ] && api_ready=false
          [ -z "$RAILWAY_TOKEN" ] && api_ready=false
          [ -z "$VERCEL_TOKEN" ] && web_ready=false
          [ -z "$VERCEL_ORG_ID" ] && web_ready=false
          [ -z "$VERCEL_PROJECT_ID" ] && web_ready=false
          echo "api-ready=$api_ready" >> "$GITHUB_OUTPUT"
          echo "web-ready=$web_ready" >> "$GITHUB_OUTPUT"
          if [ "$api_ready" = "false" ] || [ "$web_ready" = "false" ]; then
            echo "::notice::Production secrets not yet configured — deployment skipped. See docs/DEPLOY.md."
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-api:
    name: Deploy API (Railway)
    runs-on: ubuntu-latest
    environment: production
    needs: [check-secrets]
    if: needs.check-secrets.outputs.api-ready == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @agentflow/api build

      - name: Run database migrations
        working-directory: packages/api
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy to Railway
        working-directory: packages/api
        run: railway up --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-web:
    name: Deploy Web (Vercel)
    runs-on: ubuntu-latest
    environment: production
    needs: [check-secrets, deploy-api]
    if: needs.check-secrets.outputs.web-ready == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        working-directory: packages/web
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build for Vercel
        working-directory: packages/web
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        working-directory: packages/web
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
